






<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <style>
    .jumbotron {
      margin-top: 30px;
      margin-bottom: 0px;
      padding: 40px;
      background-color: #f8f9fa;
      border-radius: 10px;
    }

    .jumbotron h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-container {
      max-width: 500px;
      margin: auto;
    }

    .back-link {
      margin-top: 15px;
      display: block;
      text-align: center;
    }
  </style>
</head>

<body>

  {% include "exam/navbar.html" %}
  <br><br>

  <div class="jumbotron">
    <div class="form-container">
      <h2>Forgot your password?</h2>
      <p class="text-center">Enter your email and we’ll send you a reset link.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center">
          <button type="submit" class="btn btn-primary rounded-0">Send Reset Link</button>
        </div>
      </form>

      
    </div>
  </div>

  <br><br><br><br>
  {% include "exam/footer.html" %}

</body>
</html>
